<meta charset="utf-8">

<meta name="description" content="Every Neural Arcade game. Search by name or by the idea you want to understand, like overfitting or reward.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Neural Arcade">
<meta property="og:title" content="Every game · Neural Arcade">
<meta property="og:description" content="Every Neural Arcade game. Search by name or by the idea you want to understand, like overfitting or reward.">
<meta property="og:url" content="https://arcade.codewithnk.com/games/">
<meta property="og:image" content="https://arcade.codewithnk.com/assets/share.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta property="og:image:alt" content="Neural Arcade: small browser games where tiny neural networks learn in front of you">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Every game · Neural Arcade">
<meta name="twitter:description" content="Every Neural Arcade game. Search by name or by the idea you want to understand, like overfitting or reward.">
<meta name="twitter:image" content="https://arcade.codewithnk.com/assets/share.png">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">

<script>try { const t = localStorage.getItem('na-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<header data-site="games"></header>

<main>
  <section class="wrap b-head" aria-labelledby="bh">
    <h1 id="bh">Every game</h1>
    <p class="lead">Search by name or by the idea you want to understand, like "overfitting" or "reward".</p>
  </section>

  <div class="tools">
    <div class="wrap">
      <label class="search" for="q"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5" stroke-linecap="round"/></svg><span class="sr">Search games</span><input id="q" type="search" placeholder="Search games and ideas" autocomplete="off"></label>
      <div class="filters">
        <div class="filters" id="chips" role="group" aria-label="Category"></div>
        <label class="sort" for="sort">Sort <select id="sort"><option value="newest">Newest</option><option value="az">A to Z</option></select></label>
      </div>
    </div>
  </div>

  <section class="wrap results">
    <p class="sr" id="status" aria-live="polite"></p>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden><h2>No game teaches that yet</h2><p>Try a broader idea, or clear the filters.</p><button class="btn" type="button" id="clear">Clear search and filters</button></div>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </section>
</main>

<footer data-site></footer>

<script type="module" src="../assets/browse.js"></script>
</body>
</html>
