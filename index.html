<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neural Arcade</title>
<meta name="description" content="Three tracks that teach machine learning by playing: each lesson is a level you play, a short page you read and, where there is one, a video.">
<link rel="canonical" href="https://arcade.codewithnk.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Neural Arcade">
<meta property="og:title" content="Neural Arcade">
<meta property="og:description" content="Three tracks that teach machine learning by playing: each lesson is a level you play, a short page you read and, where there is one, a video.">
<meta property="og:url" content="https://arcade.codewithnk.com/">
<meta property="og:image" content="https://arcade.codewithnk.com/assets/share.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta property="og:image:alt" content="Neural Arcade: small browser games where tiny neural networks learn in front of you">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Neural Arcade">
<meta name="twitter:description" content="Three tracks that teach machine learning by playing: each lesson is a level you play, a short page you read and, where there is one, a video.">
<meta name="twitter:image" content="https://arcade.codewithnk.com/assets/share.png">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/studio.css">
<script>try { const t = localStorage.getItem('na-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<header data-site=""></header>

<main>
  <section class="wrap hero" aria-labelledby="h">
    <div class="hero-row">
      <div class="hero-text">
        <h1 id="h">Learn AI by playing it.</h1>
        <p>Three tracks, from the first idea to the deep end. Every lesson is a game level you play, a short page you read and, where there is one, a video.</p>
      </div>
      <section class="continue" id="continue" aria-label="Where to start"></section>
    </div>

    <div class="stage">
      <div class="stage-head" id="stage-head"><span class="live"><i></i><b>Recorded run</b></span></div>
      <div class="stage-body">
        <div class="scene"><canvas id="demo" class="pixel" role="img" aria-label="A recorded run of the newest game"></canvas></div>
        <aside class="brain" aria-label="What the brain decides right now">
          <h2 id="panel-title">Right now</h2>
          <ul class="acts-list" id="moves"></ul>
        </aside>
      </div>
    </div>
    <div class="acts" id="hero-actions"></div>
  </section>

  <section class="wrap tracks" aria-label="The three tracks">
    <ol class="trows" id="tracks"></ol>
  </section>

  <section class="wrap flow" aria-label="How a lesson works">
    <ul id="flow"></ul>
  </section>
</main>

<footer data-site></footer>

<script type="module" src="assets/home.js"></script>
</body>
</html>
