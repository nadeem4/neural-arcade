<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Room 3D spike</title>
<link rel="stylesheet" href="../../assets/studio.css">
<script type="importmap">{ "imports": { "three": "../../games/city/vendor/three.module.min.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0F1319; color: #E9EDF2; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #stats { position: fixed; top: 8px; left: 8px; right: 8px; font: 12px/1.3 var(--mono, ui-monospace, monospace); color: #7D8794; pointer-events: none; }
  #err { position: fixed; top: 30px; left: 8px; right: 8px; margin: 0; color: #FF8A70; font: 12px/1.3 var(--mono, ui-monospace, monospace); white-space: pre-wrap; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 8px max(8px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; background: linear-gradient(transparent, rgba(15,19,25,0.85) 40%); }
  #bar button { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid #3A4350; background: #1A2029; color: #E9EDF2; font: 600 15px var(--sans, system-ui, sans-serif); cursor: pointer; }
  #bar button#sweep { background: #FF5A1F; border-color: #FF5A1F; color: #fff; }
  #bar button:disabled { opacity: 0.45; cursor: default; }
  #bar button[aria-pressed="false"] { opacity: 0.7; }
  #bar label { display: flex; align-items: center; gap: 8px; min-height: 44px; font: 14px var(--sans, system-ui, sans-serif); }
  #bar input[type=range] { width: 120px; min-height: 44px; accent-color: #FF5A1F; }
  #count, #msg { font: 14px var(--mono, ui-monospace, monospace); min-width: 5.5em; }
  #msg { color: #7D8794; min-width: 0; flex-basis: 100%; text-align: center; min-height: 1.2em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats">loading...</div>
<pre id="err" hidden></pre>
<div id="bar">
  <button id="sweep" type="button">Sweep once</button>
  <button id="reset" type="button">Reset</button>
  <button id="walk" type="button">Walk uphill</button>
  <label for="gamma">Discount <output id="gammaOut">0.90</output>
    <input id="gamma" type="range" min="0.5" max="0.99" step="0.01" value="0.9"></label>
  <span id="count">Sweep 0</span>
  <button id="front" type="button" aria-pressed="true">Front walls</button>
  <div id="msg" role="status" aria-live="polite"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
